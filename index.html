<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Seguro - Simulador</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #F8F9FA;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Criando uma moldura para simular um celular no meio da tela */
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 100%;
            max-height: 820px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.15);
            border-radius: 24px;
            overflow: hidden;
            border: 8px solid #222;
            background: #fff;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 450px) {
            .phone-container {
                max-width: 100%;
                max-height: 100%;
                border: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
